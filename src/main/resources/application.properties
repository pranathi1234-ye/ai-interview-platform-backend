# ============================================================
# APPLICATION
# ============================================================

spring.application.name=ai-interview-backend

# Railway provides PORT automatically.
# Locally, it will use 8080.
server.port=${PORT:8080}


# ============================================================
# MYSQL DATABASE
# ============================================================

# Railway MySQL provides these environment variables.
# Do NOT put actual database credentials here.
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}


# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ============================================================
# GEMINI AI
# ============================================================

# Keep the API key outside the source code.
# Set GEMINI_API_KEY as an environment variable.
gemini.api.key=${GEMINI_API_KEY}

# Gemini model
gemini.model=gemini-3.5-flash-lite


# ============================================================
# FILE UPLOAD
# ============================================================

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB