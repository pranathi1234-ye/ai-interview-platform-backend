# ============================================================
# APPLICATION
# ============================================================

spring.application.name=ai-interview-backend
server.port=8080


# ============================================================
# MYSQL DATABASE
# ============================================================

spring.datasource.url=jdbc:mysql://localhost:3306/ai_interview_platform
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}


# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ============================================================
# GEMINI AI
# ============================================================

# IMPORTANT:
# Never put the real Gemini API key directly in this file.
# Set GEMINI_API_KEY in PowerShell before starting Spring Boot.

gemini.api.key=${GEMINI_API_KEY}

# Primary Gemini model
gemini.model=gemini-3.5-flash-lite


# ============================================================
# FILE UPLOAD
# ============================================================

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB